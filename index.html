<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Amergin</title>
<style>
:root{--mist:#DAE2E4;--mist-top:#C6D3D8;--sheet:#F6F8F7;--ink:#13202A;--slate:#5B6A75;--line:#CAD3D6;--rubric:#A5351C;--sea:#1E5E6C;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--mist:#0A1115;--mist-top:#0F1B22;--sheet:#111A20;--ink:#E4EAEA;--slate:#8B9CA6;--line:#25323A;--rubric:#E58B6C;--sea:#78BFCB;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);background-image:linear-gradient(var(--mist-top),var(--mist) 460px);background-repeat:no-repeat;color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;display:flex;align-items:center;justify-content:center;padding:20px}
.gate{background:var(--sheet);border-radius:3px;box-shadow:0 1px 0 var(--line),0 24px 60px -30px rgba(10,25,32,.35);padding:44px 40px 36px;width:100%;max-width:380px}
h1{font-weight:400;font-size:2.4rem;margin:0 0 26px;line-height:1}
label{display:block;font:600 .72rem/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:1.15rem;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--slate);padding:6px 0 8px;caret-color:var(--rubric)}
input[type=password]:focus{outline:none;border-bottom-color:var(--rubric)}
.rem{display:flex;gap:8px;align-items:center;margin:18px 0 0;letter-spacing:0;text-transform:none;font:400 .9rem/1.3 system-ui,sans-serif}
.rem input{accent-color:var(--sea)}
button{margin-top:24px;font:500 .95rem system-ui,sans-serif;color:var(--sheet);background:var(--ink);border:0;border-radius:999px;padding:9px 22px;cursor:pointer}
button:focus-visible,.rem input:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
#msg{min-height:1.3em;margin:16px 0 0;color:var(--rubric);font:400 .9rem/1.3 system-ui,sans-serif}
</style>
</head>
<body>
<main class="gate">
  <h1>Amergin</h1>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    <label class="rem" for="rem"><input type="checkbox" id="rem"> Remember on this device</label>
    <button type="submit" id="go">Open</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

      var keep = rem ? crypto.subtle.exportKey("raw", key).then(function(raw){ try{ localStorage.setItem(KEYNAME, toB64(new Uint8Array(raw))); }catch(e){} }) : Promise.resolve();
      return keep.then(function(){ return unlock(key); });
    }).catch(function(){
      try{ localStorage.removeItem(KEYNAME); }catch(e){}
      btn.disabled = false; msg("That password didn't open it."); document.getElementById("pw").select();
    });
  });
}
</script>
